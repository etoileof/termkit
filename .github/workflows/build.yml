name: build

on:
  push:
    branches: [main]
    paths:
      - 'payload.tar.gz'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          path: repo

      - name: Unpack payload
        run: mkdir payload && tar -xzf repo/payload.tar.gz -C payload

      - name: Fetch base and apply patches
        id: fetch
        run: bash payload/build.sh fetch

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: source/.nvmrc
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Build
        run: bash payload/build.sh build

      - name: Package
        id: package
        shell: pwsh
        run: ./payload/package.ps1 -Version '${{ steps.fetch.outputs.version }}'

      - name: Test installer (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $unzipped = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive -LiteralPath '${{ steps.package.outputs.zip }}' -DestinationPath $unzipped -Force
          & .\payload\test-setup.ps1 -Package (Join-Path $unzipped '${{ steps.package.outputs.name }}') -Version '${{ steps.fetch.outputs.version }}'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.fetch.outputs.version }}
          NAME: ${{ steps.package.outputs.name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          printf '%s\n' "Windows x64. Download \`${NAME}.zip\`, extract it, double-click \`Install.cmd\` and paste your two API keys when asked (Enter skips either). Then open a new terminal." > "$notes"
          gh release create "v${VERSION}-build${GITHUB_RUN_NUMBER}" "$ZIP" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "termkit ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes-file "$notes" --latest
